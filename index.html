<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코코포리아 스탠딩 & 토큰 크롭 도구</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .drop-zone {
            border: 2px dashed #4b5563;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .cropper-wrapper {
            max-height: 500px;
            margin-bottom: 20px;
            display: none;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .cropper-wrapper img {
            max-width: 100%;
            display: block;
        }

        .controls {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .btn {
            background-color: #374151;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #4b5563;
        }

        .btn-primary {
            background-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-accent {
            background-color: #10b981;
        }

        .btn-accent:hover {
            background-color: #059669;
        }

        .preset-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .result-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            border-top: 1px solid #4b5563;
            padding-top: 20px;
        }

        .preview-box {
            max-width: 300px;
            max-height: 400px;
            border: 1px solid #4b5563;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><rect width="8" height="8" fill="%23333"/><rect x="8" width="8" height="8" fill="%23444"/><rect y="8" width="8" height="8" fill="%23444"/><rect x="8" y="8" width="8" height="8" fill="%23333"/></svg>');
        }

        .preview-box img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <h1>🎲 코코포리아 크롭 도구</h1>
    <p class="subtitle">TRPG 세션용 스탠딩 & 아이콘을 손쉽게 자르고 다운로드하세요.</p>

    <div class="container">
        <!-- 드래그 앤 드롭 영역 -->
        <div class="drop-zone" id="dropZone">
            <p>📷 이미지를 여기에 드래그하거나 클릭하여 업로드하세요</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- 크롭 영역 -->
        <div class="cropper-wrapper" id="cropperWrapper">
            <img id="image" src="" alt="업로드된 이미지">
        </div>

        <!-- 조작 버튼 영역 -->
        <div class="controls" id="controls">
            <div class="preset-group">
                <span>비율:</span>
                <button class="btn" onclick="setAspectRatio(3/4)">스탠딩 (3:4)</button>
                <button class="btn" onclick="setAspectRatio(1/1)">토큰 (1:1)</button>
                <button class="btn" onclick="setAspectRatio(NaN)">자유</button>
            </div>
            
            <!-- ✨ 새로 추가된 자동 가운데 정렬 버튼 -->
            <button class="btn btn-accent" onclick="centerCropBox()">🎯 가운데 정렬</button>
            
            <button class="btn btn-primary" onclick="cropImage()">✂️ 잘라내기</button>
        </div>

        <!-- 결과 출력 영역 -->
        <div class="result-container" id="resultContainer">
            <h3>미리보기</h3>
            <div class="preview-box">
                <img id="resultImage" src="" alt="결과 이미지">
            </div>
            <a id="downloadBtn" class="btn btn-primary" download="ccfolia_cropped.png">📥 이미지 다운로드</a>
        </div>
    </div>

    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const image = document.getElementById('image');
        const cropperWrapper = document.getElementById('cropperWrapper');
        const controls = document.getElementById('controls');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const downloadBtn = document.getElementById('downloadBtn');

        let cropper = null;

        // 드래그 앤 드롭 이벤트
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                image.src = e.target.result;
                cropperWrapper.style.display = 'block';
                controls.style.display = 'flex';
                resultContainer.style.display = 'none';

                if (cropper) {
                    cropper.destroy();
                }

                cropper = new Cropper(image, {
                    aspectRatio: 3 / 4, // 기본 스탠딩 비율
                    viewMode: 1,
                    autoCropArea: 0.8,
                    ready() {
                        // 이미지 로드 완료 시 자동으로 가운데 정렬 실행
                        centerCropBox();
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        function setAspectRatio(ratio) {
            if (cropper) {
                cropper.setAspectRatio(ratio);
                centerCropBox(); // 비율 바꿀 때도 자동으로 가운데 정렬
            }
        }

        // ✨ 자르기 상자(Crop Box)를 화면 가운데로 위치시키는 함수
        function centerCropBox() {
            if (!cropper) return;
            
            const containerData = cropper.getContainerData();
            const cropBoxData = cropper.getCropBoxData();

            const left = (containerData.width - cropBoxData.width) / 2;
            const top = (containerData.height - cropBoxData.height) / 2;

            cropper.setCropBoxData({
                left: left,
                top: top
            });
        }

        function cropImage() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            resultImage.src = canvas.toDataURL('image/png');
            downloadBtn.href = canvas.toDataURL('image/png');
            resultContainer.style.display = 'flex';
        }
    </script>
</body>
</html>
